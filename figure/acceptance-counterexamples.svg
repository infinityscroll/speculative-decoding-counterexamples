  <g id="text_26">
   <text style="fill: #475569; font: 14px 'DejaVu Sans'; text-anchor: start" x="55.44" y="63.36" transform="rotate(-0 55.44 63.36)">Successive sampling without replacement · Hu et al., ICLR 2025</text>
  </g>
  <g id="text_27">
   <text style="fill: #15263a; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="55.44" y="443.52" transform="rotate(-0 55.44 443.52)">What fails</text>
  </g>
  <g id="text_28">
   <text style="fill: #334155; font: 12px 'DejaVu Sans'; text-anchor: start" x="55.44" y="466.56" transform="rotate(-0 55.44 466.56)">The calculation substitutes probabilities from a different without-replacement sampling law.</text>
  </g>
  <g id="text_29">
   <text style="fill: #334155; font: 11px 'DejaVu Sans'; text-anchor: start" x="55.44" y="489.6" transform="rotate(-0 55.44 489.6)">Both examples use strictly positive distributions. Exact rational proofs and separate implementations agree.</text>
  </g>
  <g id="text_30">
   <text style="fill: #475569; font: 10px 'DejaVu Sans'; text-anchor: start" x="55.44" y="524.16" transform="rotate(-0 55.44 524.16)">Scope: acceptance calculations, not measured speedups or corrected experimental tables.</text>
